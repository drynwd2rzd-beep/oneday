name: Build IPA

on:
  push:
    branches: [main, ios-native]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project OneDay.xcodeproj \
            -scheme OneDay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-device.log 2>&1 || { grep -E "error:" build-device.log; exit 1; }
          grep -E "warning: .*OneDay/" build-device.log | sort -u || true
          test -f build/device/Build/Products/Release-iphoneos/OneDay.app/OneDay

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/OneDay.app Payload/
          zip -qry OneDay-unsigned.ipa Payload
          ls -lh OneDay-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OneDay-unsigned-ipa
          path: OneDay-unsigned.ipa

      - name: Pick simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone (17|16)( Pro)? \(" | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | xargs)
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "Using $DEVICE"

      - name: Unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OneDay.xcodeproj -scheme OneDay \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/sim \
            -resultBundlePath TestResults.xcresult > test.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "Test Case .* (passed|failed)|error:|Executed [0-9]+ test" test.log | tail -60
          exit $STATUS

      - name: Screenshots in the simulator
        if: always()
        continue-on-error: true
        run: |
          set -x
          APP=build/sim/Build/Products/Debug-iphonesimulator/OneDay.app
          if [ ! -d "$APP" ]; then
            xcodebuild -project OneDay.xcodeproj -scheme OneDay -configuration Debug \
              -sdk iphonesimulator -destination "platform=iOS Simulator,name=$DEVICE" \
              -derivedDataPath build/sim build -quiet > build-sim.log 2>&1 || { grep -E "error:" build-sim.log; exit 1; }
          fi
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          mkdir -p shots
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$DEVICE" com.oneday.app || true
            xcrun simctl launch "$DEVICE" com.oneday.app "$@"
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }
          xcrun simctl ui "$DEVICE" appearance light
          for tab in today tasks plans review me; do
            shoot "glass-$tab" -OneDayDemo YES -OneDayTab $tab -OneDayStyle glass -OneDayTone warm
          done
          shoot glass-review-day -OneDayDemo YES -OneDayTab review -OneDayReview day
          shoot glass-review-stats -OneDayDemo YES -OneDayTab review -OneDayReview overview
          shoot glass-review-calendar -OneDayDemo YES -OneDayTab review -OneDayReview calendar
          shoot glass-review-photos -OneDayDemo YES -OneDayTab review -OneDayReview photos
          shoot glass-review-recap -OneDayDemo YES -OneDayTab review -OneDayReview recap
          shoot glass-review-reflect -OneDayDemo YES -OneDayTab review -OneDayReview reflect
          shoot glass-review-week -OneDayDemo YES -OneDayTab review -OneDayReview week
          shoot classic-today -OneDayDemo YES -OneDayTab today -OneDayStyle soft
          shoot flat-tasks -OneDayDemo YES -OneDayTab tasks -OneDayStyle flat -OneDayTone cool
          shoot onboarding -OneDayDemo YES -OneDayOnboarding YES
          shoot lock -OneDayDemo NO -OneDayLockPreview YES
          xcrun simctl ui "$DEVICE" content_size accessibility-large
          shoot large-text-today -OneDayDemo YES -OneDayTab today
          xcrun simctl ui "$DEVICE" content_size large
          xcrun simctl ui "$DEVICE" appearance dark
          shoot dark-today -OneDayDemo YES -OneDayTab today -OneDayStyle glass -OneDayTone warm
          shoot dark-stats -OneDayDemo YES -OneDayTab review -OneDayReview overview
          shoot meteor-today -OneDayDemo YES -OneDayTab today -OneDayTone meteor

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-logs
          path: |
            shots/
            build-device.log
            build-sim.log
            test.log
          if-no-files-found: ignore
