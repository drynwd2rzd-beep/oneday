name: OneDay
options:
  bundleIdPrefix: com.oneday
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  OneDay:
    type: application
    platform: iOS
    sources:
      - path: OneDay
    scheme:
      testTargets:
        - OneDayTests
        - OneDayUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneday.app
        PRODUCT_NAME: OneDay
        INFOPLIST_FILE: OneDay/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "9"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  OneDayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OneDayTests
    dependencies:
      - target: OneDay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.oneday.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OneDay.app/OneDay"
        BUNDLE_LOADER: "$(TEST_HOST)"
  OneDayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OneDayUITests
    dependencies:
      - target: OneDay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.oneday.app.uitests
        TEST_TARGET_NAME: OneDay
