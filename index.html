<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>一天</title><style>
:root{--i:#111114;--m:#818189;--l:#e8e8ed;--s:#f5f5f7;--b:#007aff;--r:22px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}button,input,textarea{font:inherit}.app{max-width:720px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom));min-height:100vh}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;padding:2px 0 26px}.brand{font-size:20px;font-weight:750;letter-spacing:-.05em}.iconBtn{border:0;background:var(--s);width:42px;height:42px;border-radius:14px;font-size:18px}.eyebrow{font-size:13px;color:var(--m);margin-bottom:11px}.hero h1{font-size:42px;line-height:1.06;letter-spacing:-.065em;margin:0 0 9px}.hero p{margin:0;color:var(--m);line-height:1.65}.block{margin-top:30px;padding-top:25px;border-top:1px solid var(--l)}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionHead h2{font-size:21px;letter-spacing:-.045em;margin:0}.muted{font-size:13px;color:var(--m)}.keepCard{background:var(--s);border-radius:var(--r);padding:19px}.keepCard b{display:block;font-size:17px}.keepCard span{display:block;color:var(--m);font-size:14px;margin:7px 0 13px}.keepBtn{border:0;background:#fff;border-radius:14px;padding:12px 15px;font-weight:650}.task{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--l)}.check{width:30px;height:30px;border:1.5px solid #c6c6cc;background:#fff;border-radius:50%;flex:none}.check.done{background:var(--i);border-color:var(--i);position:relative}.check.done:after{content:"✓";color:#fff;font-size:16px}.taskMain{flex:1;border:0;background:none;text-align:left;padding:0}.taskName{font-size:16px;font-weight:600}.taskNote{font-size:12px;color:var(--m);margin-top:4px}.dots{border:0;background:none;color:var(--m);font-size:18px;padding:8px}.add{width:100%;padding:17px 0;text-align:left;color:var(--b);font-weight:650;border:0;background:none}.completedToggle{width:100%;border:0;background:none;padding:17px 0 6px;text-align:left;font-weight:650;color:var(--m);font-size:14px}.completedList{display:none}.completedList.show{display:block}.task.done .taskName{text-decoration:line-through;color:var(--m)}.statusCard{background:var(--s);border-radius:var(--r);padding:18px}.statusTitle{font-size:16px;font-weight:650}.statusText{font-size:13px;color:var(--m);margin-top:6px}.progressTrack{height:7px;background:#e2e2e7;border-radius:99px;overflow:hidden;margin-top:16px}.progressFill{height:100%;background:var(--i);width:0;transition:width .25s}.list{border-top:1px solid var(--l)}.row{width:100%;border:0;border-bottom:1px solid var(--l);background:none;padding:17px 0;display:flex;align-items:center;gap:13px;text-align:left}.rowIcon{width:40px;height:40px;background:var(--s);border-radius:13px;display:grid;place-items:center}.rowMain{flex:1}.rowMain b{display:block;font-size:16px}.rowMain span{display:block;font-size:12px;color:var(--m);margin-top:4px}.chev{color:#aaa;font-size:22px}.navWrap{position:fixed;bottom:0;left:0;right:0;padding:0 12px max(9px,env(safe-area-inset-bottom));z-index:20}.nav{height:66px;max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border:1px solid var(--l);border-radius:22px}.nav button{border:0;background:none;color:var(--m);font-size:11px;border-radius:15px}.nav button.active{background:var(--s);color:var(--i);font-weight:650}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;z-index:50}.modal.active{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.handle{width:38px;height:4px;background:#d7d7dc;border-radius:99px;margin:0 auto 18px}.sheetHead{display:flex;align-items:center;justify-content:space-between}.sheetHead h2{margin:0;font-size:21px}.close{width:34px;height:34px;border:0;border-radius:50%;background:var(--s);font-size:20px}input,textarea{width:100%;border:1px solid var(--l);background:#fafafa;border-radius:14px;padding:14px;margin-top:15px}textarea{min-height:130px}.primary,.secondary{width:100%;padding:15px;border:0;border-radius:14px;margin-top:12px;font-weight:650}.primary{background:var(--i);color:#fff}.secondary{background:var(--s)}.danger{color:#c82832}.empty{padding:18px 0;color:var(--m);font-size:14px}.toast{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:100;background:#151517;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;display:none}
</style></head><body><div class="toast" id="toast"></div><main class="app">
<section class="page active" id="today"><div class="top"><div class="brand">一天</div><button class="iconBtn" data-go="me">◉</button></div><div class="hero"><div class="eyebrow" id="date"></div><h1 id="hello">今天。</h1><p id="dayState"></p></div>
<div class="block"><div class="sectionHead"><h2>值得留下</h2></div><div class="keepCard"><b>今天有什么值得记住的吗？</b><span id="journalHint">不需要写得很好，只留下真实的你。</span><button class="keepBtn" id="writeJournal">＋ 留下记录</button></div></div>
<div class="block"><div class="sectionHead"><h2>今天</h2><span class="muted" id="taskCount"></span></div><div id="taskList"></div><button class="add" id="addTask">＋ 添加一件事</button><button class="completedToggle" id="completedToggle" style="display:none">已完成 <span id="completedNum">0</span> ›</button><div class="completedList" id="completedList"></div></div>
<div class="block"><div class="statusCard"><div class="statusTitle" id="statusTitle">今天还没有安排事情</div><div class="statusText" id="statusText">从一件小事开始就够了。</div><div class="progressTrack"><div class="progressFill" id="progressFill"></div></div></div></div></section>
<section class="page" id="plan"><div class="top"><div class="brand">计划</div></div><div class="hero"><div class="eyebrow">LONG TERM</div><h1>慢一点，<br>但不要停。</h1><p>这里放长期方向，而不是塞满今天。</p></div><div class="block"><div class="empty">计划页面下一步继续和你一起打磨。</div></div></section>
<section class="page" id="review"><div class="top"><div class="brand">回顾</div></div><div class="hero"><div class="eyebrow">LOOK BACK</div><h1>看看时间<br>留下了什么。</h1></div><div class="block"><div class="empty">回顾页面下一步继续和你一起打磨。</div></div></section>
<section class="page" id="me"><div class="top"><div class="brand">我的</div><button class="iconBtn" id="backup">⇅</button></div><div class="hero"><div class="eyebrow">ONE DAY</div><h1>一个长期的<br>过程。</h1><p>成长不需要每天证明自己，只需要继续留下行动。</p></div><div class="block list"><button class="row" id="backupRow"><span class="rowIcon">⇅</span><span class="rowMain"><b>数据与备份</b><span>导入、导出你的记录</span></span><span class="chev">›</span></button></div></section></main>
<div class="navWrap"><nav class="nav"><button class="active" data-go="today"><i>◉</i>今天</button><button data-go="plan"><i>□</i>计划</button><button data-go="review"><i>⌁</i>回顾</button><button data-go="me"><i>○</i>我的</button></nav></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
(()=>{const KEY='oneday_pwa_v1',$=id=>document.getElementById(id);let D={tasks:[],journals:{},daily:{}};try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')D=Object.assign(D,x)}catch(e){}const key=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(D));render()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.t);window.t=setTimeout(()=>$('toast').style.display='none',1500)}function openSheet(t,b){$('sheet').innerHTML='<div class="handle"></div><div class="sheetHead"><h2>'+t+'</h2><button class="close" id="x">×</button></div>'+b;$('modal').classList.add('active');$('x').onclick=closeSheet}function closeSheet(){$('modal').classList.remove('active')}$('modal').onclick=e=>{if(e.target===$('modal'))closeSheet()};function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));window.scrollTo(0,0)}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function archive(){let ts=D.tasks.filter(t=>t.date===key()),done=ts.filter(t=>t.done).length;D.daily[key()]={total:ts.length,done}}function taskHTML(t){return '<div class="task '+(t.done?'done':'')+'"><button class="check '+(t.done?'done':'')+'" data-toggle="'+t.id+'"></button><button class="taskMain" data-edit="'+t.id+'"><div class="taskName">'+esc(t.title)+'</div>'+(t.note?'<div class="taskNote">'+esc(t.note)+'</div>':'')+'</button><button class="dots" data-menu="'+t.id+'">···</button></div>'}
function render(){let n=new Date(),h=n.getHours(),k=key(),ts=D.tasks.filter(t=>t.date===k),open=ts.filter(t=>!t.done),done=ts.filter(t=>t.done);$('date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(n);$('hello').textContent=h<12?'早上好。':h<18?'下午好。':'晚上好。';$('dayState').textContent=ts.length===0?'今天还没有安排事情。':done.length===0?'今天还没有开始。':done.length===ts.length?'今天安排的事情已经完成。':'今天正在进行。';$('journalHint').textContent=D.journals[k]?'今天已经留下了一段记录。':'不需要写得很好，只留下真实的你。';$('taskCount').textContent=ts.length?done.length+' / '+ts.length+' 完成':'';$('taskList').innerHTML=open.length?open.map(taskHTML).join(''):'<div class="empty">'+(ts.length?'今天剩下的事情都完成了。':'今天还是空的。')+'</div>';$('completedToggle').style.display=done.length?'block':'none';$('completedNum').textContent=done.length;$('completedList').innerHTML=done.map(taskHTML).join('');let pct=ts.length?Math.round(done.length/ts.length*100):0;$('progressFill').style.width=pct+'%';$('statusTitle').textContent=ts.length===0?'今天还没有安排事情':done.length===ts.length?'今天安排的事情已经完成':done.length?'今天已经完成 '+done.length+' 件事情':'今天还没有完成任务';$('statusText').textContent=ts.length===0?'从一件小事开始就够了。':done.length===ts.length?'今天可以慢慢收尾了。':'还有 '+open.length+' 件事情，按自己的节奏来。';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(b.dataset.edit));document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>menu(b.dataset.menu))}
function toggle(id){let t=D.tasks.find(x=>x.id===id);t.done=!t.done;archive();save();toast(t.done?'已完成':'已取消完成')}function editor(id){let t=D.tasks.find(x=>x.id===id)||{title:'',note:''};openSheet(id?'编辑任务':'添加一件事','<input id="title" placeholder="例如：阅读 20 分钟" value="'+esc(t.title)+'"><textarea id="note" placeholder="简单说明（可选）">'+esc(t.note)+'</textarea><button class="primary" id="saveTask">保存</button>');$('saveTask').onclick=()=>{let title=$('title').value.trim();if(!title)return toast('先写下这件事');if(id){let x=D.tasks.find(a=>a.id===id);x.title=title;x.note=$('note').value.trim()}else D.tasks.push({id:String(Date.now()),title,note:$('note').value.trim(),done:false,date:key()});archive();save();closeSheet()}}function menu(id){openSheet('任务操作','<button class="secondary" id="edit">编辑</button><button class="secondary" id="move">移到明天</button><button class="secondary danger" id="del">删除</button>');$('edit').onclick=()=>{closeSheet();editor(id)};$('move').onclick=()=>{let t=D.tasks.find(x=>x.id===id),d=new Date();d.setDate(d.getDate()+1);t.date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');t.done=false;archive();save();closeSheet();toast('已移到明天')};$('del').onclick=()=>{D.tasks=D.tasks.filter(x=>x.id!==id);archive();save();closeSheet()}}function journal(){let k=key();openSheet('值得留下','<textarea id="journal" placeholder="今天发生了什么？有什么想留下？">'+esc(D.journals[k]||'')+'</textarea><button class="primary" id="saveJournal">保存</button>');$('saveJournal').onclick=()=>{D.journals[k]=$('journal').value.trim();save();closeSheet();toast('已经留下')}}function backup(){openSheet('数据与备份','<p class="muted">数据保存在当前设备浏览器，可定期导出备份。</p><button class="primary" id="export">导出备份</button><button class="secondary" id="import">导入备份</button>');$('export').onclick=()=>{let a=document.createElement('a'),b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='一天-备份-'+key()+'.json';a.click();toast('已导出')};$('import').onclick=()=>$('importFile').click()}$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{D=Object.assign({tasks:[],journals:{},daily:{}},JSON.parse(r.result));save();closeSheet();toast('导入成功')}catch(_){toast('文件无效')}};r.readAsText(f)};$('writeJournal').onclick=journal;$('addTask').onclick=()=>editor();$('completedToggle').onclick=()=>$('completedList').classList.toggle('show');$('backup').onclick=backup;$('backupRow').onclick=backup;if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});archive();save()})();
</script></body></html>
