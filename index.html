<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>一天</title><link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1f242b;--muted:#737b86;--line:#e5e6e4;--blue:#246aa3;--green:#19724d;--soft:#f0f2f3;--danger:#bd4242;--shadow:0 10px 34px rgba(26,31,38,.055)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto;padding:24px 20px 112px;min-height:100vh}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 46px}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.iconBtn{width:48px;height:48px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.8);color:var(--ink);font-size:20px}.date{font-size:15px;color:var(--muted);margin-bottom:14px;font-weight:600}.hero h1{font-size:48px;line-height:1.03;letter-spacing:-2.5px;margin:0 0 15px;font-weight:820}.hero p{font-size:18px;color:var(--muted);line-height:1.65;margin:0;max-width:620px}.section{padding:28px 0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.head h2{margin:0;font-size:24px;letter-spacing:-.8px}.link{border:0;background:transparent;color:var(--blue);font-size:16px;font-weight:750;padding:8px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.compact{padding:17px 19px}.statusText{font-size:18px;font-weight:700}.muted{color:var(--muted)}.statusHint{font-size:15px;color:var(--muted);line-height:1.5;margin-top:6px}.bigNum{font-size:40px;font-weight:830;letter-spacing:-1.5px}.progress{height:6px;background:#e4e6e7;border-radius:99px;overflow:hidden;margin-top:13px}.bar{height:100%;background:var(--green);border-radius:99px;transition:.25s}.actionRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.chev{color:var(--blue);font-weight:750}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(760px,calc(100% - 24px));height:72px;border:1px solid var(--line);border-radius:25px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);display:flex;box-shadow:0 12px 38px rgba(20,20,20,.09)}.nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}.nav b{font-size:20px;line-height:1}.nav .active{color:var(--ink);font-weight:800}.tabs{display:flex;border:1px solid var(--line);background:#eef0f1;border-radius:15px;padding:3px;margin:22px 0 16px}.tabs button{flex:1;border:0;border-radius:12px;background:transparent;padding:10px;color:var(--muted);font-weight:700}.tabs .active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.05)}.taskList{background:#fff;border:1px solid var(--line);border-radius:23px;overflow:hidden}.task{display:flex;align-items:center;gap:13px;padding:16px 17px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:25px;height:25px;border:2px solid #c6ccd0;border-radius:50%;background:#fff;flex:0 0 auto}.task.done .check{background:var(--green);border-color:var(--green);position:relative}.task.done .check:after{content:'✓';color:white;position:absolute;left:5px;top:0px;font-size:15px}.taskMain{flex:1;min-width:0}.taskName{font-size:17px;font-weight:700}.task.done .taskName{text-decoration:line-through;color:var(--muted)}.taskMeta{font-size:13px;color:var(--muted);margin-top:4px}.dots{border:0;background:none;color:var(--muted);font-size:21px;padding:8px}.add{width:100%;padding:16px;border:0;background:#fff;color:var(--blue);font-weight:780;font-size:16px;text-align:left}.completed{margin-top:12px;border:0;background:none;color:var(--muted);font-size:14px;padding:7px 0}.calendar{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px}.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.calHead button{border:0;background:transparent;font-size:24px;padding:6px;color:var(--ink)}.calTitle{font-weight:800}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{font-size:12px;color:var(--muted);margin-bottom:9px}.day{height:43px;border:0;background:transparent;border-radius:13px;position:relative;color:var(--ink)}.day.selected{background:var(--ink);color:#fff;font-weight:800}.day.today:not(.selected){outline:1px solid var(--blue);color:var(--blue)}.dot{width:4px;height:4px;border-radius:50%;background:var(--green);position:absolute;bottom:6px;left:calc(50% - 2px)}.day.selected .dot{background:#fff}.empty{padding:24px 5px;color:var(--muted);line-height:1.6}.primary{width:100%;border:0;border-radius:17px;padding:15px;background:var(--ink);color:#fff;font-weight:800;margin-top:12px}.secondary{width:100%;border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff;color:var(--ink);font-weight:700;margin-top:10px}.input,.textarea,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;color:var(--ink);margin-top:10px}.textarea{min-height:160px;resize:vertical}.label{font-size:14px;font-weight:700;margin-top:15px;display:block}.plans{display:grid;gap:12px;margin-top:18px}.planCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}.planCard h3{margin:0 0 8px;font-size:18px}.planCard p{margin:0;color:var(--muted);line-height:1.55}.badge{font-size:12px;color:var(--green);font-weight:800;margin-top:10px}.reviewItem{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}.reviewItem h3{margin:0 0 7px}.reviewItem p{margin:0;color:var(--muted);line-height:1.55;white-space:pre-wrap}.rowLink{display:flex;align-items:center;justify-content:space-between;padding:18px;border:1px solid var(--line);background:#fff;border-radius:20px;margin-top:12px}.rowLink h3{margin:0;font-size:17px}.rowLink p{margin:4px 0 0;color:var(--muted);font-size:14px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.modalBox{width:min(760px,100%);margin:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.modalTitle{font-size:21px;font-weight:800;margin:5px 0 14px}.modalBtns{display:flex;gap:10px;margin-top:16px}.modalBtns button{flex:1;border-radius:15px;padding:13px;border:1px solid var(--line);background:#fff}.modalBtns .save{background:var(--ink);border-color:var(--ink);color:#fff}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%) translateY(20px);background:#1f242b;color:white;padding:11px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.quoteCard{margin-top:22px}.quoteTime{font-size:13px;color:var(--blue);font-weight:800;margin-bottom:8px}.quoteText{font-size:18px;font-weight:700;line-height:1.6}
@media(max-width:500px){.app{padding:20px 16px 112px}.top{margin-bottom:42px}.hero h1{font-size:43px}.hero p{font-size:17px}.section{padding:25px 0}.head h2{font-size:23px}}
</style></head>
<body><main class="app">
<section class="page active" id="today"><div class="top"><div class="brand">一天</div><button class="iconBtn" onclick="go('me')">⚙︎</button></div><div class="hero"><div class="date" id="dateText"></div><h1 id="greeting"></h1><p id="quoteText"></p></div><div class="section"><div class="head"><h2>值得留下</h2><button class="link" id="journalAction" onclick="openJournal()">写下来 ›</button></div><div class="card compact" id="memoryHome"></div></div><div class="section"><div class="head"><h2>今天</h2><span class="muted" id="todayCount"></span></div><div class="card compact"><div class="actionRow"><div><div class="statusText" id="todayStatus"></div><div class="statusHint" id="todayHint"></div></div><button class="link" onclick="go('tasks')">查看事项 ›</button></div></div></div><div class="section"><div class="card"><div class="muted" style="font-size:14px">今天的完成情况</div><div class="bigNum" id="todayPct">0%</div><div class="progress"><div class="bar" id="todayBar"></div></div></div></div></section>
<section class="page" id="tasks"><div class="top"><div class="brand">每日事项</div><button class="iconBtn" onclick="openTaskModal()">＋</button></div><div class="tabs"><button id="tabToday" onclick="setTaskMode('today')">今天</button><button id="tabCalendar" onclick="setTaskMode('calendar')">日历</button></div><div id="taskTodayView"></div><div id="taskCalendarView" style="display:none"></div></section>
<section class="page" id="plan"><div class="top"><div class="brand">计划</div><button class="iconBtn" onclick="openPlanModal()">＋</button></div><div class="hero"><h1>以后要去哪里。</h1><p>记录长期方向，真正行动，但不把人生压缩成一个百分比。</p></div><div id="planList" class="plans"></div><div class="card" id="planEmpty" style="margin-top:20px"><div class="statusText">还没有计划。</div><div class="statusHint">先写下一个你愿意长期靠近的方向。</div></div></section>
<section class="page" id="review"><div class="top"><div class="brand">回顾</div></div><div class="hero"><h1>回头看一看。</h1><p>不是审判过去，而是看见自己到底怎样生活。</p></div><div id="reviewList"></div></section>
<section class="page" id="me"><div class="top"><div class="brand">我的</div></div><div class="hero"><h1>留住你的数据。</h1><p>数据默认只保存在当前设备，定期备份会更安全。</p></div><div class="rowLink"><div><h3>数据备份</h3><p>导出或恢复所有事项、记录和计划</p></div><span>›</span></div><button class="primary" onclick="exportData()">导出全部数据</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"><button class="secondary" onclick="document.getElementById('importFile').click()">导入备份</button><div class="rowLink"><div><h3>关于《一天》</h3><p>简单、清晰，专注记录真实的你。</p></div><span>›</span></div></section>
</main>
<nav class="nav"><button class="active" data-go="today"><b>◎</b>今天</button><button data-go="tasks"><b>□</b>事项</button><button data-go="plan"><b>◇</b>计划</button><button data-go="review"><b>↝</b>回顾</button><button data-go="me"><b>○</b>我的</button></nav>
<div class="modal" id="taskModal"><div class="modalBox"><div class="modalTitle" id="taskModalTitle">添加事项</div><label class="label">事项名称</label><input class="input" id="taskName" placeholder="例如：阅读 20 分钟"><label class="label">备注（可选）</label><input class="input" id="taskNote" placeholder="例如：读完今天的章节"><label class="label">重复</label><select class="select" id="taskRepeat"><option value="once">仅今天</option><option value="daily">每天</option><option value="weekdays">工作日（周一至周五）</option><option value="weekly">每周（同一天）</option></select><div class="modalBtns"><button onclick="closeModal('taskModal')">取消</button><button class="save" onclick="saveTask()">保存</button></div></div></div>
<div class="modal" id="journalModal"><div class="modalBox"><div class="modalTitle">今天有什么值得留下的吗？</div><textarea class="textarea" id="journalInput" placeholder="不需要写得很好，只留下真实的你。"></textarea><div class="modalBtns"><button onclick="closeModal('journalModal')">取消</button><button class="save" onclick="saveJournal()">保存</button></div></div></div>
<div class="modal" id="planModal"><div class="modalBox"><div class="modalTitle">新增计划</div><label class="label">计划名称</label><input class="input" id="planName" placeholder="例如：学习英语"><label class="label">说明</label><textarea class="textarea" id="planDesc" placeholder="为什么这件事对你重要？你希望靠近什么？"></textarea><div class="modalBtns"><button onclick="closeModal('planModal')">取消</button><button class="save" onclick="savePlan()">保存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const STORE='oneday_v4_clean';let state={tasks:[],routines:[],journals:{},plans:[]};let taskMode='today',viewDate=key(),calDate=new Date(),editingTask=null;
const quotes=['不需要过得完美。把真正重要的事，往前推进一点。','慢一点没有关系，只要你还在向前。','不要急着证明自己，先认真过好今天。','今天不需要改变人生，认真完成一件事就已经很好。','真正的变化，往往来自那些看起来很普通的一天。','允许自己不完美，但不要放弃继续靠近想成为的自己。','时间不会替你完成什么，但每一天都可以成为新的开始。'];
function load(){try{const old=JSON.parse(localStorage.getItem('oneday_clean_v3')||'{}');const cur=JSON.parse(localStorage.getItem(STORE)||'{}');state={...state,...old,...cur};if(!Array.isArray(state.routines))state.routines=[];if(!Array.isArray(state.plans))state.plans=[];if(!Array.isArray(state.tasks))state.tasks=[]}catch(e){}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}function key(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parseDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function label(k){const d=parseDate(k),w=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];return `${d.getMonth()+1}月${d.getDate()}日 ${w[d.getDay()]}`}
function dayQuote(){let d=key(),n=0;for(const c of d)n=(n*31+c.charCodeAt(0))>>>0;return quotes[n%quotes.length]}function hello(){let h=new Date().getHours();return h<12?'早上好。':h<18?'下午好。':'晚上好。'}function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function routineApplies(r,k){if(k<r.start)return false;const d=parseDate(k),sd=parseDate(r.start);if(r.repeat==='daily')return true;if(r.repeat==='weekdays')return d.getDay()>=1&&d.getDay()<=5;if(r.repeat==='weekly')return d.getDay()===sd.getDay();return false}
function itemsFor(k){const singles=state.tasks.filter(t=>t.date===k).map(t=>({...t,source:'task'}));const routines=state.routines.filter(r=>routineApplies(r,k)).map(r=>{let occ=state.tasks.find(t=>t.routineId===r.id&&t.date===k);return occ?{...occ,source:'routine'}:{id:'virtual_'+r.id+'_'+k,routineId:r.id,date:k,name:r.name,note:r.note||'',done:false,source:'routineVirtual'}});return [...singles,...routines].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function materialize(item){if(!item.id.startsWith('virtual_'))return item;const t={id:Date.now().toString()+Math.random().toString(16).slice(2),routineId:item.routineId,date:item.date,name:item.name,note:item.note,done:item.done,createdAt:Date.now()};state.tasks.push(t);return t}
function render(){renderToday();renderTasks();renderPlans();renderReview()}
function renderToday(){const k=key(),items=itemsFor(k),done=items.filter(x=>x.done).length,pct=items.length?Math.round(done/items.length*100):0;document.getElementById('dateText').textContent=label(k);document.getElementById('greeting').textContent=hello();document.getElementById('quoteText').textContent=dayQuote();const mem=state.journals[k];document.getElementById('journalAction').textContent=mem?'已记录 ›':'写下来 ›';document.getElementById('memoryHome').innerHTML=mem?'<div class="actionRow"><div><div class="statusText">今天已经留下了。</div><div class="statusHint">想法已经保存，可以随时编辑。</div></div><span class="chev">✓</span></div>':'<div class="actionRow"><div><div class="statusText">今天有什么值得留下的吗？</div><div class="statusHint">不需要写得很好，只留下真实的你。</div></div><span class="chev">›</span></div>';document.getElementById('memoryHome').onclick=()=>openJournal();document.getElementById('todayCount').textContent=items.length?`${done}/${items.length} 已完成`:'还没有事项';document.getElementById('todayStatus').textContent=items.length?`${done}/${items.length} 件已完成`:'今天还是空的。';document.getElementById('todayHint').textContent=items.length?(done===items.length?'今天的事项已经全部完成。':'去事项里继续完成今天的事情。'):'从一件小事开始。';document.getElementById('todayPct').textContent=pct+'%';document.getElementById('todayBar').style.width=pct+'%'}
function setTaskMode(m){taskMode=m;renderTasks()}function renderTasks(){document.getElementById('tabToday').classList.toggle('active',taskMode==='today');document.getElementById('tabCalendar').classList.toggle('active',taskMode==='calendar');const a=document.getElementById('taskTodayView'),b=document.getElementById('taskCalendarView');a.style.display=taskMode==='today'?'block':'none';b.style.display=taskMode==='calendar'?'block':'none';if(taskMode==='today')renderTaskDay(a,key(),true);else renderCalendar(b)}
function renderTaskDay(el,k,withTitle=false){const items=itemsFor(k),open=items.filter(x=>!x.done),done=items.filter(x=>x.done);el.innerHTML=`${withTitle?`<div class="hero" style="margin-bottom:22px"><h1 style="font-size:32px">${label(k)}</h1><p>${done.length}/${items.length||0} 已完成</p></div>`:''}<div class="taskList">${open.length?open.map(taskHtml).join(''):'<div class="empty">${items.length?'今天的事项都完成了。':'今天还没有事项。'}</div>}<button class="add" onclick="openTaskModal()">＋ 添加一件事</button></div>${done.length?`<button class="completed" onclick="document.getElementById('done-${k}').style.display=document.getElementById('done-${k}').style.display==='none'?'block':'none'">已完成 ${done.length} 件 ›</button><div id="done-${k}" class="taskList" style="display:none;margin-top:8px">${done.map(taskHtml).join('')}</div>`:''}`}
function taskHtml(t){return `<div class="task ${t.done?'done':''}"><button class="check" onclick="toggleTask('${t.id}')"></button><div class="taskMain"><div class="taskName">${esc(t.name)}</div><div class="taskMeta">${t.note?esc(t.note):(t.routineId?'循环事项':'待完成')}</div></div><button class="dots" onclick="deleteTask('${t.id}')">···</button></div>`}
function toggleTask(id){let items=itemsFor(taskMode==='calendar'?viewDate:key()),item=items.find(x=>x.id===id);if(!item)return;item=materialize(item);item.done=!item.done;save();render()}
function deleteTask(id){if(!confirm('删除这件事？'))return;if(id.startsWith('virtual_')){showToast('循环事项不能在这里直接删除')}else{state.tasks=state.tasks.filter(x=>x.id!==id);save();render();showToast('已删除')}}
function renderCalendar(el){const y=calDate.getFullYear(),m=calDate.getMonth();const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),today=key();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=last;d++){let k=key(new Date(y,m,d)),items=itemsFor(k),has=items.length||state.journals[k];cells+=`<button class="day ${k===viewDate?'selected':''} ${k===today?'today':''}" onclick="selectDate('${k}')">${d}${has?'<i class="dot"></i>':''}</button>`}el.innerHTML=`<div class="calendar"><div class="calHead"><button onclick="changeMonth(-1)">‹</button><div class="calTitle">${y}年${m+1}月</div><button onclick="changeMonth(1)">›</button></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days">${cells}</div></div><div style="margin-top:18px"><div class="head"><h2>${label(viewDate)}</h2></div><div id="selectedDay"></div></div>`;renderTaskDay(document.getElementById('selectedDay'),viewDate,false)}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderTasks()}function selectDate(k){viewDate=k;calDate=parseDate(k);renderTasks()}
function openTaskModal(){document.getElementById('taskModalTitle').textContent='添加事项';document.getElementById('taskName').value='';document.getElementById('taskNote').value='';document.getElementById('taskRepeat').value='once';document.getElementById('taskModal').classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}function saveTask(){const name=document.getElementById('taskName').value.trim(),note=document.getElementById('taskNote').value.trim(),repeat=document.getElementById('taskRepeat').value;if(!name){showToast('请输入事项名称');return}const now=Date.now();if(repeat==='once')state.tasks.push({id:String(now),name,note,date:key(),done:false,createdAt:now});else state.routines.push({id:'r'+now,name,note,repeat,start:key(),createdAt:now});save();closeModal('taskModal');render();showToast('已保存')}
function openJournal(){document.getElementById('journalInput').value=state.journals[key()]||'';document.getElementById('journalModal').classList.add('show')}function saveJournal(){const v=document.getElementById('journalInput').value.trim();if(v)state.journals[key()]=v;else delete state.journals[key()];save();closeModal('journalModal');render();showToast(v?'已记录':'已清空')}
function openPlanModal(){document.getElementById('planName').value='';document.getElementById('planDesc').value='';document.getElementById('planModal').classList.add('show')}function savePlan(){const name=document.getElementById('planName').value.trim(),desc=document.getElementById('planDesc').value.trim();if(!name){showToast('请输入计划名称');return}state.plans.unshift({id:String(Date.now()),name,desc,createdAt:Date.now()});save();closeModal('planModal');renderPlans();showToast('计划已保存')}
function renderPlans(){const list=document.getElementById('planList'),empty=document.getElementById('planEmpty');list.innerHTML=state.plans.map(p=>`<div class="planCard"><h3>${esc(p.name)}</h3><p>${esc(p.desc||'没有额外说明。')}</p><div class="badge">进行中</div></div>`).join('');empty.style.display=state.plans.length?'none':'block'}
function renderReview(){let dates=new Set([...Object.keys(state.journals),...state.tasks.map(t=>t.date)]);state.routines.forEach(r=>dates.add(r.start));dates=[...dates].sort((a,b)=>b.localeCompare(a));const el=document.getElementById('reviewList');el.innerHTML=dates.length?dates.map(k=>{let items=itemsFor(k),done=items.filter(x=>x.done).length,j=state.journals[k];return `<div class="reviewItem" onclick="goReviewDate('${k}')"><h3>${label(k)} <span class="muted" style="float:right;font-size:14px">${done}/${items.length||0}</span></h3>${j?`<p>💡 ${esc(j)}</p>`:`<p>当天完成 ${done}/${items.length||0} 件事项</p>`}</div>`}).join(''):'<div class="card" style="margin-top:20px"><div class="statusText">还没有过去。</div><div class="statusHint">当你完成事项或写下第一句话，这里会开始保存你的每天。</div></div>'}
function goReviewDate(k){go('tasks');taskMode='calendar';viewDate=k;calDate=parseDate(k);renderTasks()}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));window.scrollTo({top:0,behavior:'smooth'});render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
function exportData(){const blob=new Blob([JSON.stringify({version:4,...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='一天-完整备份-'+key()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('备份已导出')}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state={tasks:Array.isArray(x.tasks)?x.tasks:[],routines:Array.isArray(x.routines)?x.routines:[],journals:x.journals||{},plans:Array.isArray(x.plans)?x.plans:[]};save();render();showToast('备份已恢复')}catch(err){showToast('备份文件无效')}};r.readAsText(f);e.target.value=''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');load();render();
</script></body></html>
