<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>一天</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#202124;--muted:#73777f;--line:#e8e7e3;--blue:#1469a8;--soft:#f1f3f4;--danger:#c43b3b;--shadow:0 8px 30px rgba(30,32,35,.05)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit} button{cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:24px 20px 105px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 28px}.brand{font-size:22px;font-weight:750;letter-spacing:-.5px}.iconBtn{border:1px solid var(--line);background:var(--card);width:44px;height:44px;border-radius:15px;font-size:20px;color:var(--ink)}
.date{font-size:14px;color:var(--muted);margin-bottom:12px}.hero h1{font-size:44px;line-height:1.05;letter-spacing:-2px;margin:0 0 12px}.hero p{font-size:17px;color:var(--muted);margin:0;line-height:1.6}
.section{padding:26px 0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sectionHead h2{font-size:21px;margin:0;letter-spacing:-.5px}.linkBtn{border:0;background:none;color:var(--blue);font-weight:650;padding:6px 0}
.memory{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.memoryTitle{font-weight:750;font-size:18px;margin-bottom:5px}.memoryText{color:var(--muted);font-size:15px;line-height:1.5;white-space:pre-wrap}.emptyMemory{color:var(--muted);font-size:15px}
.taskCard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.taskRow{display:flex;align-items:center;gap:14px;padding:16px 17px;border-bottom:1px solid var(--line)}.taskRow:last-child{border-bottom:0}.check{width:24px;height:24px;border:2px solid #c5c8cb;border-radius:50%;background:#fff;flex:0 0 auto}.taskRow.done .check{background:var(--ink);border-color:var(--ink);position:relative}.taskRow.done .check:after{content:"✓";position:absolute;color:#fff;left:5px;top:0px;font-size:15px}.taskMain{flex:1;min-width:0}.taskName{font-size:17px;font-weight:650}.taskMeta{font-size:13px;color:var(--muted);margin-top:4px}.taskRow.done .taskName{text-decoration:line-through;color:var(--muted)}.more{border:0;background:transparent;color:var(--muted);font-size:20px;padding:8px}
.addTask{width:100%;text-align:left;padding:17px;border:0;background:transparent;color:var(--blue);font-weight:700;font-size:16px}
.completedToggle{margin-top:12px;border:0;background:none;color:var(--muted);font-size:14px;padding:8px 0}
.status{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:19px 20px}.statusLabel{color:var(--muted);font-size:14px}.statusNum{font-size:34px;font-weight:760;margin-top:5px;letter-spacing:-1px}.progress{height:5px;background:#dedfdf;border-radius:99px;margin-top:14px;overflow:hidden}.bar{height:100%;background:var(--ink);border-radius:99px;width:0;transition:width .25s}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(760px,calc(100% - 24px));height:70px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;display:flex;z-index:5;box-shadow:0 12px 36px rgba(20,20,20,.08)}.nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.nav .active{color:var(--ink);font-weight:750}.nav .navIcon{font-size:20px;line-height:1}
.page{display:none}.page.active{display:block}.simpleCard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:18px}.simpleCard h3{margin:0 0 8px}.simpleCard p{color:var(--muted);line-height:1.6;margin:0}.planInput,.journalInput{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:#fff;color:var(--ink)}textarea.journalInput{min-height:170px;resize:vertical}.primary{margin-top:12px;width:100%;border:0;border-radius:16px;background:var(--ink);color:#fff;padding:14px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}.sheetBox{width:100%;max-width:760px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 20px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.12)}.sheetTitle{font-size:19px;font-weight:750;margin:5px 0 14px}.sheetActions{display:flex;gap:10px}.sheetActions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px}.sheetActions .danger{color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.show{display:flex}.modalBox{width:min(520px,100%);background:#fff;border-radius:24px;padding:20px}.modalBox h3{margin:0 0 10px}.modalBtns{display:flex;gap:10px;margin-top:12px}.modalBtns button{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.modalBtns .save{background:var(--ink);color:#fff;border-color:var(--ink)}
.muted{color:var(--muted)}
@media(max-width:500px){.app{padding:18px 16px 105px}.hero h1{font-size:39px}.section{padding:23px 0}}
</style>
</head>
<body>
<main class="app">
<section class="page active" id="today">
  <div class="topbar"><div class="brand">一天</div><button class="iconBtn" onclick="openSettings()" aria-label="设置">⚙︎</button></div>
  <div class="hero"><div class="date" id="dateText"></div><h1 id="greeting">下午好。</h1><p id="heroText">不需要过得完美。把真正重要的事，往前推一点。</p></div>

  <div class="section">
    <div class="sectionHead"><h2>值得留下</h2><button class="linkBtn" onclick="openJournal()">写下来</button></div>
    <div class="memory" id="memoryCard"></div>
  </div>

  <div class="section">
    <div class="sectionHead"><h2>今天</h2><span class="muted" id="taskCount"></span></div>
    <div class="taskCard"><div id="openTasks"></div><button class="addTask" onclick="openTaskModal()">＋ 添加一件事</button></div>
    <button class="completedToggle" id="completedToggle" onclick="toggleCompleted()" style="display:none"></button>
    <div class="taskCard" id="completedTasks" style="display:none"></div>
  </div>

  <div class="section">
    <div class="status"><div class="statusLabel">今天的完成情况</div><div class="statusNum" id="statusNum">0%</div><div class="progress"><div class="bar" id="progressBar"></div></div><div class="muted" id="statusText" style="margin-top:12px"></div></div>
  </div>
</section>

<section class="page" id="plan"><div class="topbar"><div class="brand">计划</div></div><div class="hero"><h1>以后要去哪里。</h1><p>这里用来记录方向，而不是给人生套进度条。</p></div><div class="simpleCard"><h3>长期方向</h3><p>写下你真正想靠近的生活或能力。它可以慢慢变化。</p><input class="planInput" id="goalInput" placeholder="例如：成为一个持续学习、身体健康、拥有选择权的人"></div><button class="primary" onclick="saveGoal()">保存</button></section>

<section class="page" id="review"><div class="topbar"><div class="brand">回顾</div></div><div class="hero"><h1>回头看一看。</h1><p>不是审判自己，而是看见自己到底在怎样生活。</p></div><div id="reviewList"></div></section>

<section class="page" id="me"><div class="topbar"><div class="brand">我的</div></div><div class="hero"><h1>你的数据。</h1><p>所有记录默认只保存在当前设备。</p></div><div class="simpleCard"><h3>数据备份</h3><p>可以导出当前所有任务、记录和计划，也可以从备份恢复。</p><button class="primary" onclick="exportData()">导出备份</button><input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)"><button class="primary" style="background:#fff;color:var(--ink)" onclick="document.getElementById('importFile').click()">导入备份</button></div><div class="simpleCard"><h3>使用说明</h3><p>首页只处理今天。计划处理方向。回顾保留过去。我的管理数据。</p></div></section>
</main>

<nav class="nav">
<button class="active" data-go="today"><span class="navIcon">◎</span>今天</button>
<button data-go="plan"><span class="navIcon">□</span>计划</button>
<button data-go="review"><span class="navIcon">↝</span>回顾</button>
<button data-go="me"><span class="navIcon">○</span>我的</button>
</nav>

<div class="modal" id="taskModal"><div class="modalBox"><h3 id="taskModalTitle">添加一件事</h3><input class="planInput" id="taskInput" placeholder="例如：阅读 20 分钟"><div class="modalBtns"><button onclick="closeTaskModal()">取消</button><button class="save" onclick="saveTask()">保存</button></div></div></div>
<div class="modal" id="journalModal"><div class="modalBox"><h3>今天有什么值得留下的吗？</h3><textarea class="journalInput" id="journalInput" placeholder="不需要写得很好，只留下真实的你。"></textarea><div class="modalBtns"><button onclick="closeJournal()">取消</button><button class="save" onclick="saveJournal()">保存</button></div></div></div>
<div class="sheet" id="taskSheet"><div class="sheetBox"><div class="sheetTitle" id="sheetTaskTitle">任务</div><div class="sheetActions"><button onclick="editSelected()">编辑</button><button onclick="moveSelectedTomorrow()">移到明天</button><button class="danger" onclick="deleteSelected()">删除</button></div><button class="primary" style="background:#f3f3f3;color:#202124" onclick="closeSheet()">取消</button></div></div>

<script>
const STORE='oneday_clean_v3';
let state={tasks:[],journals:{},goal:''}, selectedId=null, editingId=null, showCompleted=false;
function load(){try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function key(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(d=new Date()){const w=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];return `${d.getMonth()+1}月${d.getDate()}日 ${w[d.getDay()]}`}
function greeting(){let h=new Date().getHours();return h<12?'早上好。':h<18?'下午好。':'晚上好。'}
function render(){
 document.getElementById('dateText').textContent=dateLabel();document.getElementById('greeting').textContent=greeting();
 const k=key(), all=state.tasks.filter(t=>t.date===k), open=all.filter(t=>!t.done), done=all.filter(t=>t.done);
 document.getElementById('taskCount').textContent=all.length?`${done.length}/${all.length} 已完成`:'还没有安排';
 const mem=state.journals[k];document.getElementById('memoryCard').innerHTML=mem?`<div class="memoryTitle">今天留下的</div><div class="memoryText">${escapeHtml(mem)}</div>`:'<div class="emptyMemory">今天有什么值得留下的吗？</div>';
 document.getElementById('openTasks').innerHTML=open.length?open.map(taskHtml).join(''):'<div class="taskRow"><div class="taskMain"><div class="taskName muted">今天还是空的。</div><div class="taskMeta">从一件小事开始。</div></div></div>';
 const ct=document.getElementById('completedToggle'), cc=document.getElementById('completedTasks');ct.style.display=done.length?'block':'none';ct.textContent=`已完成 ${done.length} 件 ${showCompleted?'⌃':'›'}`;cc.style.display=showCompleted&&done.length?'block':'none';cc.innerHTML=showCompleted?done.map(taskHtml).join(''):'';
 const pct=all.length?Math.round(done.length/all.length*100):0;document.getElementById('statusNum').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';document.getElementById('statusText').textContent=all.length?`已经完成 ${done.length} 件，还有 ${open.length} 件。`:'从一件小事开始。';
 renderReview();
}
function taskHtml(t){return `<div class="taskRow ${t.done?'done':''}"><button class="check" aria-label="完成" onclick="toggleTask('${t.id}')"></button><div class="taskMain" onclick="openEditTask('${t.id}')"><div class="taskName">${escapeHtml(t.name)}</div><div class="taskMeta">${t.done?'已完成':'待完成'}</div></div><button class="more" onclick="openSheet('${t.id}')">···</button></div>`}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;save();render()}
function openTaskModal(){editingId=null;document.getElementById('taskModalTitle').textContent='添加一件事';document.getElementById('taskInput').value='';document.getElementById('taskModal').classList.add('show');setTimeout(()=>document.getElementById('taskInput').focus(),50)}
function openEditTask(id){editingId=id;const t=state.tasks.find(x=>x.id===id);document.getElementById('taskModalTitle').textContent='编辑这件事';document.getElementById('taskInput').value=t.name;document.getElementById('taskModal').classList.add('show')}
function closeTaskModal(){document.getElementById('taskModal').classList.remove('show')}
function saveTask(){const n=document.getElementById('taskInput').value.trim();if(!n)return;if(editingId){state.tasks.find(x=>x.id===editingId).name=n}else state.tasks.unshift({id:Date.now().toString(),name:n,date:key(),done:false,createdAt:Date.now()});save();closeTaskModal();render()}
function toggleCompleted(){showCompleted=!showCompleted;render()}
function openSheet(id){selectedId=id;const t=state.tasks.find(x=>x.id===id);document.getElementById('sheetTaskTitle').textContent=t?.name||'任务';document.getElementById('taskSheet').classList.add('show')}
function closeSheet(){document.getElementById('taskSheet').classList.remove('show')}
function editSelected(){closeSheet();openEditTask(selectedId)}
function deleteSelected(){state.tasks=state.tasks.filter(x=>x.id!==selectedId);save();closeSheet();render()}
function tomorrowKey(){let d=new Date();d.setDate(d.getDate()+1);return key(d)}
function moveSelectedTomorrow(){const t=state.tasks.find(x=>x.id===selectedId);if(t){t.date=tomorrowKey();t.done=false;save()}closeSheet();render()}
function openJournal(){document.getElementById('journalInput').value=state.journals[key()]||'';document.getElementById('journalModal').classList.add('show')}
function closeJournal(){document.getElementById('journalModal').classList.remove('show')}
function saveJournal(){state.journals[key()]=document.getElementById('journalInput').value.trim();save();closeJournal();render()}
function saveGoal(){state.goal=document.getElementById('goalInput').value.trim();save();alert('已保存')}
function openSettings(){go('me')}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));if(id==='plan')document.getElementById('goalInput').value=state.goal||'';window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
function renderReview(){const entries=Object.entries(state.journals).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('reviewList').innerHTML=entries.length?entries.map(([d,v])=>`<div class="simpleCard"><h3>${d}</h3><p>${escapeHtml(v)}</p></div>`).join(''):'<div class="simpleCard"><h3>还没有记录</h3><p>当你在“值得留下”里写下第一句话，这里会开始保存你的过去。</p></div>'}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='一天-备份-'+key()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object')throw 0;state={tasks:Array.isArray(x.tasks)?x.tasks:[],journals:x.journals||{},goal:x.goal||''};save();render();alert('备份已恢复')}catch(err){alert('备份文件无效')}};r.readAsText(f)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
load();render();
</script>
</body></html>
